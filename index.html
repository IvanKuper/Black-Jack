<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play Blackjack in your browser - bet chips, hit, stand, double down and beat the dealer." />
    <!-- FONTS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- NAVBAR -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css"
    />
    <!-- SOCIAL ICONS  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="./imgs/logo.jpg" type="image/icon type" />
    <title>Blackjack</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- NavBar -->
    <nav
      class="navbar navbar-dark bg-dark navbar-expand-lg bg-light top-0 w-100"
    >
      <div class="container">
        <div class="bumblelogo">
          <a class="navbar-brand" href="index.html"
            ><img class="logo" src="imgs/logo.jpg" alt="" />
            <span class="logoSpan">Blackjack</span></a
          >
        </div>
        <div class="collapse navbar-collapse" zid="navbarTogglerDemo03">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0"></ul>
          <form class="d-flex" role="profile">
            <div class="profile">
              <span class="text-white">
                <a href="https://www.linkedin.com/in/ivankuper/" target="_blank"
                  >Ivan Kuper
                  <img
                    class="profilePic"
                    src="imgs/Profile.jpg"
                    alt="Profile image" /></a
              ></span>
            </div>
          </form>
        </div>
      </div>
    </nav>
    <!-- End of Navbar -->

    <main class="table-wrap">
      <div class="top-row">
        <h1 class="title">Blackjack</h1>
      </div>
      <p class="subtitle">Beat the dealer &middot; 21 wins</p>

      <div class="hud">
        <div class="hud-card">
          <span class="label">Player</span>
          <span class="value" id="player-name-el">Ivan</span>
        </div>
        <div class="hud-card">
          <span class="label">Chips</span>
          <span class="value" id="chips-el">$100</span>
        </div>
        <div class="hud-card">
          <span class="label">Bet</span>
          <span class="value" id="bet-el">$0</span>
        </div>
        <div class="hud-card">
          <span class="label">Streak</span>
          <span class="value" id="streak-el">0</span>
        </div>
        <button class="icon-btn" id="sound-toggle-btn" title="Toggle sound" aria-label="Toggle sound">
          <i class="fa-solid fa-volume-high"></i>
        </button>
      </div>

      <div class="bet-panel" id="bet-panel">
        <span class="chip c5" data-value="5">$5</span>
        <span class="chip c25" data-value="25">$25</span>
        <span class="chip c50" data-value="50">$50</span>
        <span class="chip c100" data-value="100">$100</span>
        <button class="secondary" id="clear-bet-btn">Clear Bet</button>
        <button id="deal-btn">Deal</button>
      </div>

      <p id="message-el">Place your bet to start the round.</p>

      <section class="felt" id="felt">
        <div class="hand-section">
          <div class="hand-label">
            <i class="fa-solid fa-user-tie"></i> Dealer
            <span class="hand-sum" id="dealer-sum-el">0</span>
          </div>
          <div class="hand" id="dealer-hand-el"></div>
        </div>
        <div class="hand-section">
          <div class="hand-label">
            <i class="fa-solid fa-user"></i> You
            <span class="hand-sum" id="player-sum-el">0</span>
          </div>
          <div class="hand" id="player-hand-el"></div>
        </div>
      </section>

      <div class="controls">
        <button id="hit-btn" disabled>Hit</button>
        <button id="stand-btn" disabled>Stand</button>
        <button id="double-btn" disabled>Double Down</button>
        <button class="secondary" id="new-round-btn" disabled>New Round</button>
        <button class="danger" id="reset-btn">Reset Chips</button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto bottom-0 pt-3">
      <p class="copyright">
        Coded & Designed By:
        <strong
          ><a href="https://ivankuper.netlify.app/" target="_blank"
            >Ivan Kuper</a
          ></strong
        >
        © All rights reserved.
      </p>
      <div class="socials">
        <a
          class="link"
          target="_blank"
          href="https://www.facebook.com/ivankuper7"
          ><i class="socials fab fa-facebook fa-2x px-1"></i
        ></a>
        <a
          class="link"
          target="_blank"
          href="https://www.instagram.com/ivan_kuper/"
          ><i class="socials fab fa-instagram fa-2x px-1"></i
        ></a>
        <a class="link" target="_blank" href="https://twitter.com/Ivan7Kuper"
          ><i class="socials fab fa-twitter fa-2x px-1"></i
        ></a>
        <a
          class="link"
          target="_blank"
          href="https://www.linkedin.com/in/ivan-kuper-b99581225/"
          ><i class="fa-brands fa-linkedin fa-2x px-1"></i
        ></a>
      </div>
    </footer>
    <!-- End  Footer -->
    <script src="./app.js"></script>
  </body>
</html>
